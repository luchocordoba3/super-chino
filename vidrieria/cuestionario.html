<style>
/* Layout: una columna por pasos. Encabezado fijo con progreso, una sección por pantalla, barra de acciones abajo. */
:root {
  --bg: #eef3f1;
  --surface: #ffffff;
  --fg: #13201c;
  --muted: #56665f;
  --line: #d3dfda;
  --accent: #1f6f5f;
  --accent-soft: #dcece7;
  --on-accent: #ffffff;
  --edge: #8fc3b4;
  --danger: #a23a2a;
  --display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1513; --surface: #16211e; --fg: #e3ece8; --muted: #94a6a0; --line: #27352f;
    --accent: #6cc4ad; --accent-soft: #1d3a33; --on-accent: #0b1714; --edge: #3f7f6f; --danger: #f08a76;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1513; --surface: #16211e; --fg: #e3ece8; --muted: #94a6a0; --line: #27352f;
  --accent: #6cc4ad; --accent-soft: #1d3a33; --on-accent: #0b1714; --edge: #3f7f6f; --danger: #f08a76;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 17px; line-height: 1.5; }
.wrap { max-width: 640px; margin: 0 auto; padding-inline: 16px; padding-block: 0 140px; }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 14px 12px; border-bottom: 1px solid var(--line); }
.eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.top h2 { font-family: var(--display); font-weight: 700; font-size: 28px; line-height: 1.1; margin: 2px 0 10px; text-wrap: balance; }
.progress { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.progress > i { display: block; height: 100%; background: linear-gradient(90deg, var(--edge), var(--accent)); transition: width .25s ease; }

.intro { padding-block: 28px 8px; display: grid; gap: 14px; }
.intro h1 { font-family: var(--display); font-weight: 700; font-size: clamp(34px, 9vw, 48px); line-height: 1.02; margin: 0; text-wrap: balance; }
.intro p { margin: 0; max-width: 60ch; }
.spec { font-family: var(--mono); font-size: 13px; color: var(--muted); border-left: 3px solid var(--edge); padding-left: 10px; }
.steps { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 8px; }
.steps button { width: 100%; display: grid; grid-template-columns: 2.2em 1fr auto; align-items: center; gap: 10px; text-align: left; font: inherit; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; cursor: pointer; }
.steps .n { font-family: var(--mono); font-size: 13px; color: var(--muted); }
.steps .c { font-family: var(--mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.steps .c.done { color: var(--accent); }

.q { display: grid; gap: 8px; padding-block: 20px; border-bottom: 1px solid var(--line); }
.q:last-child { border-bottom: 0; }
.ql { font-weight: 600; margin: 0; line-height: 1.35; }
.qh { font-size: 15px; color: var(--muted); margin: -4px 0 0; }
input[type="text"], textarea { width: 100%; font: inherit; font-size: 16px; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
textarea { min-height: 96px; resize: vertical; }
input::placeholder, textarea::placeholder { color: var(--muted); opacity: .7; }
.otro { font-size: 15px; padding: 10px 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font: inherit; font-size: 15px; line-height: 1.3; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 9px 14px; cursor: pointer; text-align: left; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.multi .chip[aria-pressed="true"]::before { content: "✓ "; }
.chip.ns { border-style: dashed; color: var(--muted); }
.chip.ns[aria-pressed="true"] { color: var(--on-accent); }
.err { color: var(--danger); font-size: 15px; margin: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.final { padding-block: 22px; display: grid; gap: 14px; }
.final p { margin: 0; }
.out { font-family: var(--mono); font-size: 13px; line-height: 1.5; min-height: 260px; max-height: 50vh; white-space: pre-wrap; }
.send { display: grid; gap: 10px; }
.note { font-size: 15px; color: var(--muted); }
.mail { font-family: var(--mono); font-size: 14px; user-select: all; color: var(--fg); background: var(--accent-soft); padding: 2px 6px; border-radius: 6px; word-break: break-all; }
.warn { background: var(--accent-soft); border-radius: 12px; padding: 12px 14px; display: grid; gap: 8px; }
.linkbtn { font: inherit; font-size: 15px; background: none; border: 0; padding: 0; color: var(--accent); text-decoration: underline; cursor: pointer; justify-self: start; }
.danger { color: var(--danger); }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.status { font-size: 15px; color: var(--accent); min-height: 1.5em; margin: 0; }

.btn { display: inline-flex; justify-content: center; align-items: center; gap: 8px; font: inherit; font-weight: 600; text-decoration: none; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; cursor: pointer; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.small { padding: 8px 12px; font-size: 15px; }
.bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line); padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); }
.bar-in { max-width: 608px; margin: 0 auto; display: flex; gap: 10px; }
.bar .btn { flex: 1; }
@media (prefers-reduced-motion: reduce) { .progress > i { transition: none; } }
</style>

    { id: 'estilo', t: 'many', s: 'Estilo', l: '¿Qué estilo te gusta?', o: ['Moderno y simple', 'Industrial, de taller', 'Clásico y confiable', 'Colorido', 'De alta gama'] },
    { id: 'colores', t: 'text', s: 'Colores', l: '¿Tu marca tiene colores?', h: 'Ej.: azul y gris, los del logo', ns: true },
    { id: 'referencias', t: 'area', s: 'Referencias', l: 'Webs o cuentas de Instagram que te gusten, del rubro o no' },
    { id: 'dominio', t: 'one', s: 'Dominio', l: '¿Tenés dominio propio (tunegocio.com.ar)?', o: ['Sí', 'No, pero quiero', 'No sé qué es'] }
  ]}
];

const NS = 'No sé';
const LAST = S.length + 1; // 0 = inicio, 1..9 = secciones, 10 = revisar y enviar
let A = {};
let step = 0;

try {
  const d = JSON.parse(localStorage.getItem(KEY) || 'null');
  if (d) { A = d.a || {}; step = Math.min(Math.max(d.step || 0, 0), LAST); }
} catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify({ a: A, step })); } catch (e) {} }

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}

function val(q) {
  const v = A[q.id];
  const parts = Array.isArray(v) ? v.slice() : (v && String(v).trim() ? [String(v).trim()] : []);
  const o = (A[q.id + '_otro'] || '').trim();
  if (o) parts.push('Otro: ' + o);
  return parts.join(', ').replace(/\s*\n+\s*/g, ' / ');
}
const answered = sec => sec.qs.filter(q => val(q)).length;
const total = () => S.reduce((n, s) => n + s.qs.length, 0);

function buildText() {
  const n = S.reduce((k, s) => k + answered(s), 0);
  const lines = [
    '*CUESTIONARIO VIDRIERÍA*',
    'Negocio: ' + ((A.nombre || '').trim() || '(sin nombre)'),
    'Fecha: ' + new Date().toLocaleDateString('es-AR'),
    'Respondidas: ' + n + ' de ' + total()
  ];
  S.forEach((sec, i) => {
    const rows = sec.qs.map(q => [q, val(q)]).filter(r => r[1]);
    if (!rows.length) return;
    lines.push('', '*' + (i + 1) + '. ' + sec.title.toUpperCase() + '*');
    rows.forEach(([q, v]) => lines.push('• ' + q.s + ': ' + v));
  });
  return lines.join('\n');
}

function renderQ(q) {
  const box = el('div', 'q');
  const qid = 'q-' + q.id;
  if (q.t === 'text' || q.t === 'area') {
    const lab = el('label', 'ql', q.l + (q.req ? ' *' : ''));
    lab.htmlFor = qid;
    box.append(lab);
    if (q.h) box.append(el('p', 'qh', q.h));
    const inp = q.t === 'area' ? el('textarea') : el('input');
    if (q.t === 'text') inp.type = 'text';
    inp.id = qid;
    inp.value = A[q.id] || '';
    let nsGroup = null;
    inp.addEventListener('input', () => {
      A[q.id] = inp.value;
      save();
      if (nsGroup) nsGroup.firstChild.setAttribute('aria-pressed', String(inp.value === NS));
    });
    box.append(inp);
    if (q.ns) { nsGroup = chipGroup({ id: q.id + '_ns', t: 'one', o: [] }, true, qid); box.append(nsGroup); }
    if (q.req) { const e = el('p', 'err'); e.id = 'err-' + q.id; e.hidden = true; box.append(e); }
  } else {
    const lab = el('p', 'ql', q.l);
    lab.id = 'l-' + q.id;
    box.append(lab);
    if (q.h) box.append(el('p', 'qh', q.h));
    box.append(chipGroup(q, q.ns));
  }
  if (q.otro) {
    const o = el('input', 'otro');
    o.type = 'text';
    o.id = qid + '-otro';
    o.placeholder = 'Otro (escribilo acá)';
    o.setAttribute('aria-label', 'Otro: ' + q.l);
    o.value = A[q.id + '_otro'] || '';
    o.addEventListener('input', () => { A[q.id + '_otro'] = o.value; save(); });
    box.append(o);
  }
  return box;
}

// Para preguntas de texto con "No sé", el chip escribe "No sé" en el campo.
function chipGroup(q, withNs, textId) {
  const g = el('div', 'chips' + (q.t === 'many' ? ' multi' : ''));
  g.setAttribute('role', 'group');
  if (!textId) g.setAttribute('aria-labelledby', 'l-' + q.id);
  const opts = q.o.slice();
  if (withNs) opts.push(NS);
  opts.forEach(opt => {
    const b = el('button', 'chip' + (opt === NS ? ' ns' : ''), opt);
    b.type = 'button';
    const on = () => {
      if (textId) return (A[textId.slice(2)] || '') === NS;
      const v = A[q.id];
      return q.t === 'many' ? Array.isArray(v) && v.includes(opt) : v === opt;
    };
    b.setAttribute('aria-pressed', String(on()));
    b.addEventListener('click', () => {
      if (textId) {
        const key = textId.slice(2);
        A[key] = A[key] === NS ? '' : NS;
        document.getElementById(textId).value = A[key];
      } else if (q.t === 'many') {
        let v = Array.isArray(A[q.id]) ? A[q.id] : [];
        v = v.includes(opt) ? v.filter(x => x !== opt) : v.concat(opt);
        A[q.id] = v;
      } else {
        A[q.id] = A[q.id] === opt ? '' : opt;
      }
      save();
      g.querySelectorAll('.chip').forEach(c => {
        const t = c.textContent;
        const pressed = textId ? (A[textId.slice(2)] === NS)
          : q.t === 'many' ? A[q.id].includes(t) : A[q.id] === t;
        c.setAttribute('aria-pressed', String(pressed));
      });
    });
    g.append(b);
  });
  return g;
}

function renderIntro(main) {
  const w = el('section', 'intro');
  w.append(el('h1', null, 'Contanos cómo trabaja tu vidriería'));
  w.append(el('p', null, 'Con tus respuestas armamos tu página web y tu sistema de presupuestos, a la medida de cómo trabajás. Son 9 partes y llevan unos 10 minutos.'));
  w.append(el('p', null, 'Solo el nombre del negocio es obligatorio. Si algo no lo sabés, saltealo o tocá "No sé". Lo que vas cargando queda guardado en este celular, así que podés seguir después.'));
  w.append(el('p', 'spec', 'Medidas en milímetros, ancho × alto. Ej.: 1200 × 1800'));
  const ol = el('ol', 'steps');
  S.forEach((sec, i) => {
    const li = el('li');
    const b = el('button');
    b.type = 'button';
    const a = answered(sec);
    b.append(el('span', 'n', String(i + 1).padStart(2, '0')), el('span', null, sec.title), el('span', 'c' + (a === sec.qs.length ? ' done' : ''), a + '/' + sec.qs.length));
    b.addEventListener('click', () => go(i + 1));
    li.append(b);
    ol.append(li);
  });
  w.append(ol);
  main.append(w);
}

function renderFinal(main) {
  const w = el('section', 'final');
  const text = buildText();
  const name = (A.nombre || '').trim();
  w.append(el('p', null, 'Estas son tus respuestas. Mandalas por WhatsApp o por mail, como te quede más cómodo.'));
  if (!name) {
    const warn = el('div', 'warn');
    warn.append(el('p', null, 'Falta el nombre del negocio.'));
    const b = el('button', 'linkbtn', 'Completarlo');
    b.type = 'button';
    b.addEventListener('click', () => go(1));
    warn.append(b);
    w.append(warn);
  }
  const out = el('textarea', 'out');
  out.id = 'out';
  out.readOnly = true;
  out.value = text;
  out.setAttribute('aria-label', 'Resumen de respuestas');
  w.append(out);

  const subject = 'Cuestionario vidriería – ' + (name || 'sin nombre');
  const send = el('div', 'send');
  const wa = el('a', 'btn primary', 'Enviar por WhatsApp');
  wa.href = 'https://wa.me/' + WA_NUMBER + '?text=' + encodeURIComponent(text);
  wa.target = '_blank';
  wa.rel = 'noopener';
  const gm = el('a', 'btn', 'Enviar por Gmail');
  gm.href = 'https://mail.google.com/mail/?view=cm&fs=1&to=' + encodeURIComponent(EMAIL) + '&su=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(text);
  gm.target = '_blank';
  gm.rel = 'noopener';
  const cp = el('button', 'btn', 'Copiar respuestas');
  cp.type = 'button';
  const status = el('p', 'status');
  status.setAttribute('role', 'status');
  cp.addEventListener('click', () => copy(text, out, status, 'Copiado. Pegalo en WhatsApp o en un mail.'));
  send.append(wa, gm, cp, status);
  w.append(send);

  const mailP = el('p', 'note');
  mailP.append('¿Usás otro mail? Copiá las respuestas y mandalas a ', el('span', 'mail', EMAIL), '. ');
  const mt = el('a', null, 'Abrir mi app de mail');
  mt.href = 'mailto:' + EMAIL + '?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(text);
  mailP.append(mt);
  w.append(mailP);
  w.append(el('p', 'note', 'Si el texto no aparece completo en WhatsApp, usá "Copiar respuestas" y pegalo. Las fotos (logo, trabajos hechos, un presupuesto en papel) mandalas aparte por WhatsApp.'));

  const reset = el('div', 'row');
  const rb = el('button', 'linkbtn danger', 'Borrar todo y empezar de nuevo');
  rb.type = 'button';
  const confirmRow = el('div', 'row');
  confirmRow.hidden = true;
  confirmRow.append(el('span', 'note', 'Se borra todo lo que cargaste.'));
  const yes = el('button', 'btn small', 'Sí, borrar');
  yes.type = 'button';
  yes.addEventListener('click', () => { A = {}; save(); go(0); });
  const no = el('button', 'btn small', 'Cancelar');
  no.type = 'button';
  no.addEventListener('click', () => { confirmRow.hidden = true; rb.hidden = false; });
  confirmRow.append(yes, no);
  rb.addEventListener('click', () => { rb.hidden = true; confirmRow.hidden = false; });
  reset.append(rb, confirmRow);
  w.append(reset);
  main.append(w);
}

function copy(text, field, status, ok) {
  const fallback = () => { field.focus(); field.select(); status.textContent = 'Texto seleccionado: copialo con Copiar del celular.'; };
  try {
    navigator.clipboard.writeText(text).then(() => { status.textContent = ok; }, fallback);
  } catch (e) { fallback(); }
}

function navBtn(label, cls, fn) {
  const b = el('button', 'btn' + (cls ? ' ' + cls : ''), label);
  b.type = 'button';
  b.addEventListener('click', fn);
  return b;
}

function render() {
  const main = document.getElementById('main');
  const nav = document.getElementById('nav');
  main.textContent = '';
  nav.textContent = '';
  document.getElementById('bar').style.width = Math.round((step / LAST) * 100) + '%';
  const eb = document.getElementById('eyebrow');
  const st = document.getElementById('stepTitle');

  if (step === 0) {
    eb.textContent = 'Cuestionario';
    st.textContent = 'Para tu vidriería';
    renderIntro(main);
    const any = Object.keys(A).some(k => A[k] && A[k].length);
    nav.append(navBtn(any ? 'Seguir completando' : 'Empezar', 'primary', () => {
      const next = S.findIndex(s => answered(s) < s.qs.length);
      go(any && next >= 0 ? next + 1 : 1);
    }));
    if (any) nav.append(navBtn('Revisar y enviar', null, () => go(LAST)));
  } else if (step === LAST) {
    eb.textContent = 'Último paso';
    st.textContent = 'Revisá y mandá';
    renderFinal(main);
    nav.append(navBtn('Atrás', null, () => go(LAST - 1)), navBtn('Ver las partes', null, () => go(0)));
  } else {
    const sec = S[step - 1];
    eb.textContent = 'Parte ' + step + ' de ' + S.length;
    st.textContent = sec.title;
    sec.qs.forEach(q => main.append(renderQ(q)));
    nav.append(navBtn('Atrás', null, () => go(step - 1)));
    nav.append(navBtn(step === S.length ? 'Revisar y enviar' : 'Siguiente', 'primary', () => {
      if (step === 1 && !(A.nombre || '').trim()) {
        const e = document.getElementById('err-nombre');
        e.textContent = 'Escribí el nombre del negocio para seguir.';
        e.hidden = false;
        document.getElementById('q-nombre').focus();
        return;
      }
      go(step + 1);
    }));
  }
}

function go(n) {
  step = n;
  save();
  render();
  window.scrollTo(0, 0);
}

render();
</script>
