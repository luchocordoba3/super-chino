# Receta de Render para cuando este proyecto esté en su propio repo (Lumina): New -> Blueprint.
# Mientras viva dentro de super-chino, crear el servicio a mano (ver README).
services:
  - type: web
    name: lumina-vidrieria
    runtime: docker
    plan: free
    region: virginia
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lumina-vidrieria-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_DEMO
        value: "true"

databases:
  - name: lumina-vidrieria-db
    plan: free
    region: virginia
    databaseName: vidrieria
    user: vidrieria
